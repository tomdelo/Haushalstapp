<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rennbahn 🏁</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e7d32; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.6); color: #fff; text-align: center; padding: 14px; z-index: 10; overflow: auto; }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 38px; text-shadow: 0 3px 0 #000; }
  .players { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .player { background: rgba(255,255,255,.12); border-radius: 18px; padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .player label { font-weight: 700; font-size: 18px; }
  .player input { width: 110px; font-size: 24px; text-align: center; border-radius: 10px; border: none; padding: 4px; font-weight: 800; }
  .swatch { width: 70px; height: 30px; border-radius: 8px; border: 3px solid #fff; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button.big { font-size: 21px; font-weight: 800; padding: 12px 20px; border-radius: 16px; border: none; background: #ffca28; color: #222; box-shadow: 0 5px 0 #b28704; }
  button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 #b28704; }

  /* Steuer-Knöpfe */
  .ctrl { position: fixed; bottom: 12px; display: grid; gap: 10px; z-index: 5; }
  .ctrl.left { left: 12px; } .ctrl.right { right: 12px; }
  .ctrl.duo { grid-template-columns: 70px 70px; grid-template-areas: "gas gas" "l r"; }
  .ctrl.solo-steer { grid-template-columns: 76px 76px; grid-template-areas: "l r"; }
  .ctrl.solo-gas { grid-template-columns: 110px; grid-template-areas: "gas"; }
  .ctrl div { height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; border: 4px solid rgba(255,255,255,.85); opacity: .85; }
  .ctrl.solo-steer div { height: 76px; }
  .ctrl .gas { grid-area: gas; border-radius: 20px; font-size: 22px; font-weight: 900; background: linear-gradient(#43d64b,#1b8f22) !important; }
  .ctrl.solo-gas .gas { height: 110px; font-size: 26px; }
  .ctrl .l { grid-area: l; } .ctrl .r { grid-area: r; }
  .ctrl div.on { opacity: 1; transform: scale(.92); filter: brightness(1.25); }

  #hud { position: fixed; top: 6px; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; z-index: 5; pointer-events: none; }
  #hud span { background: rgba(0,0,0,.6); color: #fff; padding: 4px 10px; border-radius: 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  #count { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 #000; pointer-events: none; z-index: 6; }
  .hint { font-size: 14px; opacity: .85; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"></div>
<div id="count"></div>

<div class="ctrl left hidden" id="ctrlL"></div>
<div class="ctrl right hidden" id="ctrlR"></div>

<div class="screen" id="menu">
  <h1>🏁 Rennbahn 🏎️</h1>
  <div class="players">
    <div class="player">
      <label>Ich</label>
      <div class="swatch" style="background:#0d2b8c"></div>
      <input id="num0" type="number" inputmode="numeric" value="190">
    </div>
    <div class="player">
      <label>Papa</label>
      <div class="swatch" style="background:linear-gradient(90deg,#d6a8ff,#5a1a8c)"></div>
      <input id="num1" type="number" inputmode="numeric" value="190">
    </div>
  </div>
  <div class="btns">
    <button class="big" data-mode="0">🚗 Ich allein</button>
    <button class="big" data-mode="1">🚗 Papa allein</button>
    <button class="big" data-mode="2">🚗🚗 Zu zweit</button>
  </div>
  <div class="hint">3 Runden · Grüner Knopf = Gas geben · ◀ ▶ = lenken<br>
  Loslassen = Auto rollt langsamer · Vor scharfen Kurven Gas wegnehmen!<br>
  Tastatur: Ich = ↑ ← → · Papa = W A D</div>
</div>

<div class="screen hidden" id="end">
  <h1 id="endText"></h1>
  <div id="endInfo" style="font-size:20px"></div>
  <div class="btns">
    <button class="big" id="again">🔁 Nochmal</button>
    <button class="big" id="toMenu">🏠 Menü</button>
  </div>
</div>

<script>
// ---------- Strecke ----------
// Große Welt; die Kamera fährt mit dem Auto mit.
const K = 1.9, PAD = 320;                        // Vergrößerung + Wiese rundherum
const W = Math.round(1000*K+2*PAD), H = Math.round(620*K+2*PAD), TRACK_W = 66, LAPS = 3;
const CTRL = [
  [200,550],[450,556],[700,550],          // lange Gerade unten (Start)
  [870,548],[915,532],[925,495],          // SCHARFE Ecke unten rechts
  [925,410],[912,350],[860,325],          // normale Kurve
  [700,330],[575,336],                    // nach links
  [528,318],[518,280],[548,258],          // SCHARFE Haarnadel
  [620,250],[800,245],[880,238],          // nach rechts
  [915,210],[915,165],[905,100],          // SCHARFE Ecke
  [890,68],[850,60],                      // Haarnadel oben rechts
  [620,64],[440,70],                      // Gerade oben
  [345,95],[300,165],[230,198],[165,175], // S-Kurve (normal)
  [110,148],[78,170],[75,215],            // SCHARFE Ecke links
  [130,280],[230,345],[220,395],          // normale Kurve + Schikane
  [140,430],[90,470],[95,525],[140,548]   // zurück zum Start
].map(([x,y])=>[x*K+PAD,y*K+PAD]);

function catmull(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return [
    0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
const PTS = [];
for (let i=0;i<CTRL.length;i++){
  const n=CTRL.length, p0=CTRL[(i-1+n)%n], p1=CTRL[i], p2=CTRL[(i+1)%n], p3=CTRL[(i+2)%n];
  const steps = Math.max(6, Math.round(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/6));
  for (let s=0;s<steps;s++) PTS.push(catmull(p0,p1,p2,p3,s/steps));
}
const N = PTS.length;

// ---------- Bildschirm ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
}
addEventListener('resize', resize); resize();

// ---------- Hintergrund einmal vorzeichnen ----------
let bg = null, mini = null;
const BGS = 1.25;  // Auflösung des Hintergrunds
function drawTrackPath(c){
  c.beginPath(); c.moveTo(PTS[0][0],PTS[0][1]);
  for (const p of PTS) c.lineTo(p[0],p[1]);
  c.closePath();
}
function buildBg(){
  bg = document.createElement('canvas'); bg.width = W*BGS; bg.height = H*BGS;
  const b = bg.getContext('2d'); b.scale(BGS,BGS);
  b.fillStyle='#3b9b3f'; b.fillRect(0,0,W,H);
  b.fillStyle='#43a547'; for(let x=0;x<W;x+=80) b.fillRect(x,0,40,H);
  // Bäume (zufällig, aber nicht auf der Strecke)
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<260;i++){
    const x=rnd()*W, y=rnd()*H;
    if (PTS.some(p=>(p[0]-x)**2+(p[1]-y)**2 < (TRACK_W+40)**2)) continue;
    b.fillStyle='#1b5e20'; b.beginPath(); b.arc(x,y,20,0,7); b.fill();
    b.fillStyle='#2e7d32'; b.beginPath(); b.arc(x-5,y-5,12,0,7); b.fill();
  }
  b.lineJoin='round'; b.lineCap='round';
  // Randsteine rot/weiß
  drawTrackPath(b); b.strokeStyle='#fff'; b.lineWidth=TRACK_W+16; b.stroke();
  b.lineCap='butt'; b.setLineDash([14,14]); drawTrackPath(b); b.strokeStyle='#e53935'; b.stroke(); b.setLineDash([]); b.lineCap='round';
  // Asphalt
  drawTrackPath(b); b.strokeStyle='#555'; b.lineWidth=TRACK_W; b.stroke();
  // Mittellinie
  b.setLineDash([16,20]); drawTrackPath(b); b.strokeStyle='rgba(255,255,255,.55)'; b.lineWidth=2.5; b.stroke(); b.setLineDash([]);
  // Start/Ziel kariert
  const a=PTS[0], c=PTS[3], ang=Math.atan2(c[1]-a[1],c[0]-a[0]);
  b.save(); b.translate(a[0],a[1]); b.rotate(ang);
  const sq=TRACK_W/6;
  for(let i=0;i<6;i++) for(let j=0;j<2;j++){ b.fillStyle=(i+j)%2?'#000':'#fff'; b.fillRect(j*sq-sq, -TRACK_W/2+i*sq, sq, sq); }
  b.restore();
  // Mini-Karte
  mini = document.createElement('canvas'); mini.width = 250; mini.height = 250*H/W;
  const m = mini.getContext('2d'); m.scale(250/W,250/W);
  m.fillStyle='rgba(0,0,0,.45)'; m.fillRect(0,0,W,H);
  m.lineJoin='round'; drawTrackPath(m); m.strokeStyle='#ddd'; m.lineWidth=TRACK_W*1.3; m.stroke();
}
buildBg();

// ---------- Autos ----------
const CARS_DEF = [
  {name:'Ich',  body:'#0d2b8c', body2:'#0d2b8c', dot:'#2f6bff', keys:{L:['ArrowLeft'],R:['ArrowRight'],G:['ArrowUp']}},
  {name:'Papa', body:'#d6a8ff', body2:'#5a1a8c', dot:'#c58bff', keys:{L:['a','A'],R:['d','D'],G:['w','W']}}
];
let cars=[], mode=0, state='menu', countT=0, raceT=0, finishOrder=[];
const input = {L0:false,R0:false,G0:false,L1:false,R1:false,G1:false};

function btn(cls,k,label,id){ return `<div class="${cls}" data-k="${k}${id}" style="background:${colorOf(id)}">${label}</div>`; }
function colorOf(id){ return id===0?'#0d2b8c':'linear-gradient(135deg,#d6a8ff,#5a1a8c)'; }
function buildControls(m){
  const L=document.getElementById('ctrlL'), R=document.getElementById('ctrlR');
  L.className='ctrl left'; R.className='ctrl right';
  if (m===2){
    L.classList.add('duo'); R.classList.add('duo');
    L.innerHTML = btn('gas','G','GAS',1)+btn('l','L','◀',1)+btn('r','R','▶',1);
    R.innerHTML = btn('gas','G','GAS',0)+btn('l','L','◀',0)+btn('r','R','▶',0);
  } else {
    L.classList.add('solo-steer'); R.classList.add('solo-gas');
    L.innerHTML = btn('l','L','◀',m)+btn('r','R','▶',m);
    R.innerHTML = btn('gas','G','GAS',m);
  }
  for (const k in input) input[k]=false;
  document.querySelectorAll('.ctrl div').forEach(d=>{
    const set=v=>{ input[d.dataset.k]=v; d.classList.toggle('on',v); };
    d.addEventListener('pointerdown',e=>{ e.preventDefault(); try{d.setPointerCapture(e.pointerId);}catch(_){} set(true); });
    d.addEventListener('pointerup',()=>set(false));
    d.addEventListener('pointercancel',()=>set(false));
    d.addEventListener('lostpointercapture',()=>set(false));
  });
}

function startRace(m){
  mode=m;
  const a=PTS[0], c=PTS[3], ang=Math.atan2(c[1]-a[1],c[0]-a[0]);
  const ids = m===2?[0,1]:[m];
  cars = ids.map((id,k)=>{
    const off = ids.length===2 ? (k===0?-16:16) : 0;
    const back = 45;
    const x=a[0]-Math.cos(ang)*back - Math.sin(ang)*off, y=a[1]-Math.sin(ang)*back + Math.cos(ang)*off;
    return {
      id, def:CARS_DEF[id], num: String(document.getElementById('num'+id).value||'0').slice(0,4),
      x, y, a:ang, v:0, idx:N-8, lap:0, cp:0, done:false, time:0, lapStart:0, best:null,
      cam:{x, y}
    };
  });
  finishOrder=[]; raceT=0; countT=3.999; state='count';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  buildControls(m);
}

function nearestIdx(car){
  let best=car.idx, bd=1e9;
  for(let o=-25;o<=40;o++){
    const i=(car.idx+o+N)%N, p=PTS[i], d=(p[0]-car.x)**2+(p[1]-car.y)**2;
    if(d<bd){bd=d;best=i;}
  }
  return {i:best, d:Math.sqrt(bd)};
}

const MAX_V = 300, GRASS_V = 95;
function update(dt){
  if (state==='count'){ countT-=dt; if(countT<=0){ state='race'; } }
  for (const car of cars){
    // Kamera folgt weich, etwas vor das Auto
    const tx=car.x+Math.cos(car.a)*car.v*0.35, ty=car.y+Math.sin(car.a)*car.v*0.35;
    car.cam.x += (tx-car.cam.x)*Math.min(1,dt*4); car.cam.y += (ty-car.cam.y)*Math.min(1,dt*4);
  }
  if (state!=='race' && state!=='finish' && state!=='over') return;
  if (state!=='over') raceT+=dt;
  for (const car of cars){
    const steer = car.done?0:((input['R'+car.id]?1:0)-(input['L'+car.id]?1:0));
    const gas = !car.done && input['G'+car.id];
    const near = nearestIdx(car);
    const onTrack = near.d < TRACK_W/2+5;
    if (gas){
      let target = onTrack ? MAX_V : GRASS_V;
      if (steer!==0) target *= 0.85;
      if (car.v<target) car.v += (target-car.v)*Math.min(1,dt*1.1) + 20*dt;
      else car.v += (target-car.v)*Math.min(1,dt*3);
    } else {
      car.v -= (onTrack?110:220)*dt;                  // ohne Gas: rollt aus
    }
    if (!onTrack && car.v>GRASS_V) car.v -= 260*dt;   // Gras bremst
    car.v = Math.max(0, Math.min(MAX_V, car.v));
    car.a += steer * 3.3 * dt * Math.min(1, car.v/60);
    car.x += Math.cos(car.a)*car.v*dt; car.y += Math.sin(car.a)*car.v*dt;
    car.x=Math.max(12,Math.min(W-12,car.x)); car.y=Math.max(12,Math.min(H-12,car.y));
    // Runden zählen über Kontrollpunkte
    const prev=car.idx; car.idx=near.i;
    const q = Math.floor(car.idx/(N/4));
    if (q===car.cp+1 && q<=3) car.cp=q;
    if (prev>N*0.8 && car.idx<N*0.2 && car.cp===3){
      car.cp=0; car.lap++;
      const lt=raceT-car.lapStart; car.lapStart=raceT;
      if(car.best===null||lt<car.best) car.best=lt;
      if (car.lap>=LAPS && !car.done){ car.done=true; car.time=raceT; finishOrder.push(car); }
    }
  }
  // Autos schubsen sich weg
  if (cars.length===2){
    const [a,b]=cars, dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if (d<28 && d>0.01){ const p=(28-d)/2, nx=dx/d, ny=dy/d; a.x-=nx*p; a.y-=ny*p; b.x+=nx*p; b.y+=ny*p; a.v*=.97; b.v*=.97; }
  }
  if (state==='race' && finishOrder.length===1 && cars.length===2) state='finish';
  if (finishOrder.length===cars.length && state!=='over'){ state='over'; setTimeout(showEnd,900); }
}

function fmt(t){ return t.toFixed(1).replace('.',',')+' s'; }
function showEnd(){
  const w=finishOrder[0];
  document.getElementById('endText').textContent = cars.length===2 ? `🏆 ${w.def.name} (${w.num}) gewinnt!` : `🏁 Geschafft, ${w.num}!`;
  document.getElementById('endInfo').innerHTML = finishOrder.map((c,i)=>`${i+1}. ${c.def.name} #${c.num} – ${fmt(c.time)} (beste Runde ${fmt(c.best)})`).join('<br>');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('ctrlL').classList.add('hidden'); document.getElementById('ctrlR').classList.add('hidden');
}

// ---------- Zeichnen ----------
function drawCar(c){
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
  const L=42, Wd=23;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-L/2+2,-Wd/2+3,L,Wd);
  ctx.fillStyle='#111';
  for (const [x,y] of [[-15,-14],[8,-14],[-15,9],[8,9]]) ctx.fillRect(x,y,10,5);
  const g=ctx.createLinearGradient(L/2,0,-L/2,0); g.addColorStop(0,c.def.body); g.addColorStop(1,c.def.body2);
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-L/2,-Wd/2,L,Wd,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#222'; ctx.fillRect(-L/2-2,-Wd/2,3,Wd);
  ctx.fillStyle='rgba(180,220,255,.9)'; ctx.fillRect(8,-7,6,14);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(-6,0,11,9,0,0,7); ctx.fill();
  ctx.restore();
  // Zahl immer aufrecht lesbar
  ctx.save();
  ctx.translate(c.x-6*Math.cos(c.a), c.y-6*Math.sin(c.a));
  ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`900 ${c.num.length>3?7:9}px system-ui`;
  ctx.fillText(c.num, 0, 0.5);
  ctx.restore();
}

function viewports(){
  const w=cv.width, h=cv.height;
  if (cars.length<2) return [{x:0,y:0,w,h,car:cars[0]}];
  // Zu zweit: geteilter Bildschirm – Papa links/oben, Ich rechts/unten
  const papa=cars.find(c=>c.id===1), me=cars.find(c=>c.id===0);
  if (w>=h) return [{x:0,y:0,w:w/2,h,car:papa},{x:w/2,y:0,w:w/2,h,car:me}];
  return [{x:0,y:0,w,h:h/2,car:papa},{x:0,y:h/2,w,h:h/2,car:me}];
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#255e28'; ctx.fillRect(0,0,cv.width,cv.height);
  if (state==='menu' || !cars.length){
    // Menü: ganze Strecke als Vorschau
    const s=Math.min(cv.width/W, cv.height/H);
    ctx.setTransform(s,0,0,s,(cv.width-W*s)/2,(cv.height-H*s)/2);
    ctx.drawImage(bg,0,0,W,H);
  } else {
    for (const vp of viewports()){
      const s = Math.min(vp.w, vp.h)/560 * (vp.w<vp.h*0.8||vp.h<vp.w*0.8 ? 1.05 : 1);
      const cam={...vp.car.cam}, hw=vp.w/2/s, hh=vp.h/2/s;
      cam.x=Math.max(hw,Math.min(W-hw,cam.x)); cam.y=Math.max(hh,Math.min(H-hh,cam.y));
      ctx.save();
      ctx.beginPath(); ctx.rect(vp.x,vp.y,vp.w,vp.h); ctx.clip();
      ctx.setTransform(s,0,0,s, vp.x+vp.w/2-cam.x*s, vp.y+vp.h/2-cam.y*s);
      ctx.drawImage(bg,0,0,W,H);
      for (const c of cars) drawCar(c);
      ctx.restore();
      // Mini-Karte oben links im Bildausschnitt
      const mw=Math.min(vp.w*0.28, 170*dpr), mh=mw*H/W, mx=vp.x+8*dpr, my=vp.y+(vp.y===0?44:8)*dpr;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(mini,mx,my,mw,mh);
      for (const c of cars){
        ctx.fillStyle=c.def.dot; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*dpr;
        ctx.beginPath(); ctx.arc(mx+c.x/W*mw, my+c.y/H*mh, (c===vp.car?5:3.5)*dpr, 0, 7); ctx.fill(); ctx.stroke();
      }
      // Tacho
      const car=vp.car, sp=Math.round(car.v/MAX_V*180);
      ctx.font=`900 ${16*dpr}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
      const bx=vp.x+vp.w-66*dpr, by=vp.y+(vp.y===0?62:24)*dpr;
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(bx-55*dpr,by-15*dpr,110*dpr,30*dpr,10*dpr); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillText(`${sp} km/h`, bx, by+1);
    }
    if (cars.length===2){
      ctx.fillStyle='#000';
      if (cv.width>=cv.height) ctx.fillRect(cv.width/2-2*dpr,0,4*dpr,cv.height);
      else ctx.fillRect(0,cv.height/2-2*dpr,cv.width,4*dpr);
    }
  }
  // HUD
  document.getElementById('hud').innerHTML = cars.map(c=>
    `<span style="border:3px solid ${c.def.dot}">${c.def.name} #${c.num} · Runde ${Math.min(c.lap+1,LAPS)}/${LAPS}${c.done?' 🏁':''}</span>`
  ).join('') + (state==='race'||state==='finish'?`<span>⏱ ${fmt(raceT)}</span>`:'');
  const ce=document.getElementById('count');
  if (state==='count'){ const n=Math.ceil(countT)-1; ce.textContent = n>0?n:'LOS!'; }
  else if (state==='race' && raceT<0.8) ce.textContent='LOS!';
  else ce.textContent='';
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Eingabe ----------
addEventListener('keydown',e=>{
  for (const id of [0,1]) for (const s of ['L','R','G']) if (CARS_DEF[id].keys[s].includes(e.key)){ input[s+id]=true; e.preventDefault(); }
});
addEventListener('keyup',e=>{
  for (const id of [0,1]) for (const s of ['L','R','G']) if (CARS_DEF[id].keys[s].includes(e.key)) input[s+id]=false;
});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startRace(+b.dataset.mode));
document.getElementById('again').onclick=()=>startRace(mode);
document.getElementById('toMenu').onclick=()=>{
  state='menu'; cars=[];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
};
</script>
